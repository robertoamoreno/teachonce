[workspace]
resolver = "3"
members = ["crates/core", "crates/capture", "crates/narration", "crates/agent", "crates/recorder", "crates/server", "src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
rust-version = "1.90"
authors = ["Roberto Moreno"]
repository = "https://github.com/robertoamoreno/teachonce"
homepage = "https://github.com/robertoamoreno/teachonce"

[workspace.dependencies]
skillrec-core = { path = "crates/core" }
skillrec-capture = { path = "crates/capture" }
skillrec-narration = { path = "crates/narration" }
skillrec-agent = { path = "crates/agent" }
skillrec-recorder = { path = "crates/recorder" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
