[package]
name = "teachonce"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Teach it once: record a task and hand your agent the skill."

[lib]
name = "teachonce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
base64 = "0.23"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
skillrec-core = { path = "../crates/core" }
skillrec-capture = { path = "../crates/capture" }
skillrec-narration = { path = "../crates/narration" }
skillrec-agent = { path = "../crates/agent" }
skillrec-recorder = { path = "../crates/recorder" }
